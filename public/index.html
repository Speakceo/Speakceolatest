<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO — visible to crawlers before JS hydrates -->
    <title>Orbit Student — #1 AI Learning Portal for Kids | Courses, AI Tools &amp; Scholarships</title>
    <meta name="description" content="Orbit Student — AI-powered learning portal for kids 8-18. Access AI tools, courses, live classes &amp; scholarship prep. Join 2,500+ young entrepreneurs building the future." />
    <meta name="keywords" content="Orbit Student, Orbit Student login, Orbit Student portal, AI learning for kids, AI student, AI tools for students, kids entrepreneurship, scholarship for kids, Orbit AI, orbitstudent.com" />
    <meta name="author" content="Orbit Future Academy" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="language" content="en" />
    <meta name="theme-color" content="#1876D2" />
    <meta name="msapplication-TileColor" content="#1876D2" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.orbitstudent.com/" />

    <!-- Open Graph (Facebook / LinkedIn / WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Orbit Student" />
    <meta property="og:title" content="Orbit Student — #1 AI Learning Portal for Kids" />
    <meta property="og:description" content="AI-powered learning portal for kids 8-18. Courses, AI tools, live classes &amp; scholarship prep. Join 2,500+ young entrepreneurs." />
    <meta property="og:url" content="https://www.orbitstudent.com/" />
    <meta property="og:image" content="https://www.orbitstudent.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Orbit Student — AI Learning Portal for Kids" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@orbitstudent" />
    <meta name="twitter:creator" content="@orbitstudent" />
    <meta name="twitter:title" content="Orbit Student — #1 AI Learning Portal for Kids" />
    <meta name="twitter:description" content="AI-powered learning portal for kids 8-18. Courses, AI tools, live classes &amp; scholarship prep." />
    <meta name="twitter:image" content="https://www.orbitstudent.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="Orbit Student Platform" />

    <!-- App / PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Orbit Student" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- DNS Prefetch + Preconnect -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Critical Font — Poppins (inline async to avoid render blocking) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" />
    </noscript>

    <!-- RSS & Sitemaps -->
    <link rel="alternate" type="application/rss+xml" title="Orbit Student Blog" href="https://www.orbitstudent.com/rss.xml" />
    <link rel="sitemap" type="application/xml" href="https://www.orbitstudent.com/sitemap.xml" />

    <!-- Base Structured Data (static — reinforces entity before JS) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Orbit Student",
      "alternateName": ["Orbit AI Student", "OrbitStudent", "Orbit Learning Portal"],
      "url": "https://www.orbitstudent.com",
      "description": "AI-powered learning portal for kids 8-18. Courses, AI tools, live classes and scholarship prep.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.orbitstudent.com/blog?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "Orbit Student",
      "alternateName": ["Orbit AI", "Orbit Future Academy", "OrbitStudent"],
      "url": "https://www.orbitstudent.com",
      "logo": "https://www.orbitstudent.com/images/hero/orbit-logo.png",
      "image": "https://www.orbitstudent.com/og-image.jpg",
      "description": "Orbit Student is an AI-powered learning portal for kids aged 8-18, offering courses in entrepreneurship, AI tools, live mentorship, and scholarship preparation.",
      "foundingDate": "2024",
      "email": "hello@orbitstudent.com",
      "sameAs": [
        "https://twitter.com/orbitstudent",
        "https://facebook.com/orbitstudent",
        "https://linkedin.com/company/orbitstudent",
        "https://instagram.com/orbitstudent",
        "https://youtube.com/@orbitstudent"
      ],
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "IN"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "reviewCount": "2500",
        "bestRating": "5"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
