<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1876D2"/>
      <stop offset="100%" style="stop-color:#00B0FF"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B0FF"/>
      <stop offset="50%" style="stop-color:#40C4FF"/>
      <stop offset="100%" style="stop-color:#1876D2"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#orbitGrad)"/>
  <!-- Inner dark circle for depth -->
  <circle cx="256" cy="256" r="200" fill="#0a1628" opacity="0.9"/>
  <!-- Orbit ring 1 -->
  <ellipse cx="256" cy="256" rx="160" ry="60" fill="none" stroke="url(#ringGrad)" stroke-width="6" transform="rotate(-20, 256, 256)" opacity="0.7"/>
  <!-- Orbit ring 2 -->
  <ellipse cx="256" cy="256" rx="140" ry="50" fill="none" stroke="#00B0FF" stroke-width="4" transform="rotate(30, 256, 256)" opacity="0.4"/>
  <!-- Center sphere -->
  <circle cx="256" cy="256" r="50" fill="url(#orbitGrad)"/>
  <circle cx="240" cy="242" r="18" fill="white" opacity="0.25"/>
  <!-- Orbiting dot -->
  <circle cx="400" cy="230" r="14" fill="#00B0FF"/>
  <circle cx="396" cy="226" r="5" fill="white" opacity="0.4"/>
  <!-- Letter O -->
  <text x="256" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="90" font-weight="800" fill="white" text-anchor="middle" opacity="0.95">O</text>
</svg>
