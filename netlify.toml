[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"
  SECRETS_SCAN_ENABLED = "false"

# ─── Canonical domain enforcer ──────────────────────────────────────────────
# Primary host is https://www.orbitstudent.com
# Host-based rule catches BOTH http and https apex in one hop (avoids chains).
#
# Pretty URLs: Netlify serves dist/<route>/index.html as /<route>/ (trailing slash).
# Sitemap + <link rel="canonical"> MUST use trailing slashes for those URLs or
# GSC reports "Page with redirect" / "Alternative page with proper canonical tag".

[[redirects]]
  from = "/*"
  to = "https://www.orbitstudent.com/:splat"
  status = 301
  force = true
  conditions = {Host = ["orbitstudent.com"]}

# Legacy explicit rules (kept as backup if Host conditions are ignored)
[[redirects]]
  from = "http://orbitstudent.com/*"
  to = "https://www.orbitstudent.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.orbitstudent.com/*"
  to = "https://www.orbitstudent.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://orbitstudent.com/*"
  to = "https://www.orbitstudent.com/:splat"
  status = 301
  force = true

# ─── Campaign hub → primary lander (avoid Soft 404 from SPA homepage shell) ─
[[redirects]]
  from = "/lp"
  to = "/lp/free-demo/"
  status = 301
  force = true

[[redirects]]
  from = "/lp/"
  to = "/lp/free-demo/"
  status = 301
  force = true

# ─── SPA fallback — ONLY when no static file or folder index exists ─────────
# Do NOT use force=true — prerendered dist/<page>/index.html must win.
# Netlify serves those as /page/ automatically (Pretty URLs).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {path = ["!/*.xml", "!/*.txt", "!/*.json", "!/*.html", "!/*.js", "!/*.css", "!/*.png", "!/*.jpg", "!/*.jpeg", "!/*.gif", "!/*.svg", "!/*.ico", "!/*.woff", "!/*.woff2"]}

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sitemap and robots.txt MUST come before /* catch-all
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/sitemap-advanced.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/rss.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/sitemap-advanced.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    # Security Headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    
    # Performance Headers
    X-DNS-Prefetch-Control = "on"
    X-Preload = "true"
    
    # SEO and Analytics Headers
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://api.openai.com https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: https://www.google-analytics.com https://www.facebook.com; media-src 'self' data: blob:; connect-src 'self' https://api.openai.com https://api.jsonbin.io https://prod.spline.design https://unpkg.com https://www.google-analytics.com https://analytics.google.com https://www.facebook.com https://connect.facebook.net https://*.supabase.co wss://*.supabase.co;"
    
    # Do NOT set sitewide X-Robots-Tag: index here.
    # SPA fallback URLs would inherit it and get Soft 404 when they serve homepage HTML.
    # Per-page robots come from prerendered <meta name="robots"> / react-helmet.
    Link = "</rss.xml>; rel=alternate; type=application/rss+xml; title=Orbit Student Blog RSS Feed"

[[headers]]
  for = "/login"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/login/"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dashboard/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Compress assets
[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Encoding = "gzip"

# Preload critical resources
[[headers]]
  for = "/index.html"
  [headers.values]
    Link = "</assets/css/main.css>; rel=preload; as=style, </assets/js/main.js>; rel=preload; as=script"